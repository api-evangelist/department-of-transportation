  The U.S. Department of Transportation (DOT) and its operating administrations - NHTSA, FMCSA, FAA, FRA, FTA, MARAD,
  PHMSA, and BTS - publish a number of public APIs covering vehicles, motor carriers, aviation, transit, freight, and
  transportation statistics.
